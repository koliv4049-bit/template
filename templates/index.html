<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Malaria Detection AI</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#1e3c72,#2a5298);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:12px;
width:400px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
color:#1e3c72;
margin-bottom:10px;
}

p{
color:gray;
margin-bottom:25px;
}

input[type="file"]{
margin-bottom:20px;
}

button{
background:#1e3c72;
color:white;
border:none;
padding:12px 25px;
font-size:16px;
border-radius:6px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#16305a;
}

.result{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#2a5298;
}

</style>

</head>

<body>

<div class="container">

<h1>Malaria Detection AI</h1>

<p>Upload a blood cell image to detect malaria</p>

<form method="POST" enctype="multipart/form-data">

<input type="file" name="image" required>

<br>

<button type="submit">Predict</button>

</form>

<div class="result">
{{ result }}
</div>

</div>

</body>
</html>
